<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Типы возражений</title>
<link rel="stylesheet" href="style.css">
<style>
  table col.c1 { width: 30%; }
  table col.c2 { width: 38%; }
  table col.c3 { width: 32%; }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="title-bar">🤔 Типы возражений</div>
    <table>
      <colgroup>
        <col class="c1"><col class="c2"><col class="c3">
      </colgroup>
      <thead>
        <tr>
          <th>Тип</th>
          <th>Примеры</th>
          <th>Что делаем</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><strong>Обоснованное</strong></td>
          <td>Аллергия, пищевые предпочтения, нет желания пробовать</td>
          <td>Принимаем и предлагаем другое</td>
        </tr>
        <tr>
          <td><strong>Необоснованное</strong></td>
          <td>«Не стоит своих денег», «Я уже ел тартар, было невкусно»</td>
          <td>Работаем с ним: это сомнение, а не отказ</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
