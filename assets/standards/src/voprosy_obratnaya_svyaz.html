<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Открытые и закрытые вопросы</title>
<link rel="stylesheet" href="style.css">
<style>
  table col.c1 { width: 50%; }
  table col.c2 { width: 50%; }
</style>
</head>
<body>
<div class="page">
  <div class="card">
    <div class="title-bar">🗣 Открытые и закрытые вопросы</div>
    <table>
      <colgroup>
        <col class="c1"><col class="c2">
      </colgroup>
      <thead>
        <tr>
          <th class="neg">❌ Закрытые вопросы</th>
          <th class="pos">✅ Открытые вопросы</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>«Всё нормально?»</td>
          <td>«Как для вас приготовили блюдо?»</td>
        </tr>
        <tr>
          <td>«Вам всё понравилось?»</td>
          <td>«Что скажете о прожарке?»</td>
        </tr>
        <tr>
          <td>«Вы наелись?»</td>
          <td>«Как вам сочетание в салате?»</td>
        </tr>
        <tr>
          <td>—</td>
          <td>«Я вижу, вы не доели карпаччо. С ним всё в порядке?»</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
